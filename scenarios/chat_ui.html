<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJUK Order Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#efeae2;height:100vh;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100vh;max-width:960px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.18);background:#efeae2}
.topbar{background:#202c33;color:#fff;padding:10px 20px;display:flex;align-items:center;gap:14px}
.topbar .tt{font-weight:700;font-size:17px;margin-right:auto;white-space:nowrap}
.topbar label{font-size:10px;color:#8696a0;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:2px}
.topbar input,.topbar select{padding:6px 10px;border:1px solid #374151;border-radius:6px;font-size:12px;background:#111b21;color:#e9edef;outline:none}
.topbar input:focus,.topbar select:focus{border-color:#00a884}
.topbar input[type=password]{width:200px;font-family:monospace;font-size:11px}
.chat-area{flex:1;overflow-y:auto;padding:16px 28px}
.mw{display:flex;margin-bottom:5px}
.mw.cu{justify-content:flex-start}
.mw.bo{justify-content:flex-end}
.mb{max-width:72%;padding:8px 12px;border-radius:8px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.mw.cu .mb{background:#fff;border-top-left-radius:0}
.mw.bo .mb{background:#d9fdd3;border-top-right-radius:0}
.mb .tm{font-size:9px;color:#667781;text-align:right;margin-top:4px}
.sysmsg{text-align:center;margin:12px 0}
.sysmsg span{background:rgba(0,0,0,.06);color:#54656f;padding:5px 14px;border-radius:8px;font-size:12px}
.typw{display:inline-flex;gap:5px;padding:12px 16px;background:#d9fdd3;border-radius:8px;border-top-right-radius:0;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.tdt{width:7px;height:7px;background:#8696a0;border-radius:50%;animation:tp 1.4s infinite ease-in-out}
.tdt:nth-child(2){animation-delay:.2s}.tdt:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.bottom{background:#f0f2f5;border-top:1px solid #d1d7db}
.fin-row{padding:6px 16px;display:flex;gap:8px}
.fbtn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.fbtn.pri{background:#0070f3;color:#fff}.fbtn.pri:hover{background:#005bd4}
.fbtn.sec{background:#e5e7eb;color:#374151}.fbtn.sec:hover{background:#d1d5db}
.input-row{padding:8px 16px 12px;display:flex;gap:10px;align-items:flex-end}
.input-row textarea{flex:1;padding:10px 14px;border:1px solid #d1d7db;border-radius:8px;font-size:14px;font-family:inherit;resize:none;outline:none;min-height:44px;max-height:130px;line-height:1.4}
.input-row textarea:focus{border-color:#00a884}
.sbtn{width:46px;height:44px;border-radius:50%;background:#00a884;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sbtn:hover{background:#008069}
.sbtn svg{fill:#fff;width:20px;height:20px}
.ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.ov.sh{display:flex}
.modd{background:#fff;border-radius:12px;width:720px;max-height:82vh;overflow-y:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modd h2{font-size:17px;margin-bottom:14px}
.modd pre{background:#1e293b;color:#e2e8f0;padding:16px;border-radius:8px;font-size:11px;overflow-x:auto;max-height:420px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c5c5c5;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
  <div class="tt">TJUK Order Bot</div>
  <div><label>API Key</label><input type="password" id="apiKey" placeholder="sk-ant-..."></div>
  <div><label>Model</label>
    <select id="mdl">
      <option value="claude-sonnet-4-5-20250929">Sonnet 4.5</option>
      <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
      <option value="claude-opus-4-20250514">Opus 4</option>
    </select>
  </div>
</div>
<div class="chat-area" id="cb">
  <div class="sysmsg"><span>You are a customer. Introduce yourself and place your order.</span></div>
</div>
<div class="bottom">
  <div class="fin-row">
    <button class="fbtn pri" onclick="finalizeOrder()">Finalize Order (JSON + Conversions)</button>
    <button class="fbtn sec" onclick="if(confirm('Reset chat?')){hist=[];document.getElementById('cb').innerHTML='<div class=sysmsg><span>Chat reset. Introduce yourself and place your order.</span></div>'}">Reset</button>
  </div>
  <div class="input-row">
    <textarea id="inp" placeholder="Hi, this is Rahul from Good Food Concept..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();snd()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px'"></textarea>
    <button class="sbtn" onclick="snd()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
</div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)this.classList.remove('sh')">
  <div class="modd">
    <h2>Finalized Order</h2>
    <pre id="ej">Loading...</pre>
    <div style="margin-top:14px;text-align:right">
      <button class="fbtn pri" onclick="navigator.clipboard.writeText(document.getElementById('ej').textContent)" style="flex:none;padding:8px 20px">Copy JSON</button>
      <button class="fbtn sec" onclick="document.getElementById('ov').classList.remove('sh')" style="flex:none;padding:8px 20px;margin-left:6px">Close</button>
    </div>
  </div>
</div>

async function snd(ov){
  var inp=document.getElementById('inp');
  var txt=ov||inp.value.trim();
  if(!txt||wt)return;
  var key=document.getElementById('apiKey').value.trim();
  if(!key){alert('Enter your Anthropic API key in the top bar.');return}
  addMsg('cu',txt);
  if(!ov){inp.value='';inp.style.height='44px'}
  hist.push({role:'user',content:txt});
  wt=true;showT();
  try{
    var resp=await callAPI(key,hist,SP);
    hideT();hist.push({role:'assistant',content:resp});addMsg('bo',resp);
  }catch(e){hideT();addMsg('bo','[Error: '+e.message+']')}
  wt=false;inp.focus();
}

async function callAPI(key,msgs,sys){
  var mdl=document.getElementById('mdl').value;
  var r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'x-api-key':key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:mdl,max_tokens:4096,system:sys,messages:msgs})
  });
  var d=await r.json();
  if(r.status!==200)throw new Error(d.error?d.error.message:JSON.stringify(d));
  return d.content.filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
}

async function finalizeOrder(){
  if(!hist.length){alert('Chat first, then finalize.');return}
  var key=document.getElementById('apiKey').value.trim();
  if(!key){alert('Enter API key.');return}
  var ep='SYSTEM: Output the FINAL order as JSON now. Apply ALL quantity conversions using the product catalog.\n\n';
  ep+='Format:\n{\n  "customer_code": "CX00123",\n  "customer_name": "NAME",\n  "orders": [{\n    "ship_to": "LOCATION",\n    "lines": [{\n';
  ep+='      "item_code": "from catalog",\n      "item_name": "from catalog",\n      "quantity_pcs": 72,\n      "uom": "PCS",\n';
  ep+='      "customer_said": "3 case coke",\n      "conversion": "3 case x 24 (PackSize) = 72 PCS",\n';
  ep+='      "pack_size_used": 24,\n      "unit_weight_used": 0\n    }]\n  }]\n}\n\n';
  ep+='RULES:\n- ALL quantities in PCS after conversion\n- Show conversion math for EVERY line\n';
  ep+='- Use PackSize from catalog for case/box/ctn\n- Use UnitWeight from catalog for kg\n';
  ep+='- Match item_code from PRODUCT CATALOG. If no match use UNKNOWN\n';
  ep+='- Include ALL items (additions minus cancellations)\n- Output ONLY the JSON';
  document.getElementById('ej').textContent='Finalizing with conversions...';
  document.getElementById('ov').classList.add('sh');
  var em=hist.concat([{role:'user',content:ep}]);
  try{
    var resp=await callAPI(key,em,SP);
    var jm=resp.match(/\{[\s\S]*\}/);
    if(jm){try{var p=JSON.parse(jm[0]);document.getElementById('ej').textContent=JSON.stringify(p,null,2)}catch(e){document.getElementById('ej').textContent=resp}}
    else{document.getElementById('ej').textContent=resp}
  }catch(e){document.getElementById('ej').textContent='Error: '+e.message}
}

function addMsg(role,txt){
  var cb=document.getElementById('cb');var w=document.createElement('div');
  w.className='mw '+(role==='cu'?'cu':'bo');
  var b=document.createElement('div');b.className='mb';
  var td=document.createElement('div');td.textContent=txt;b.appendChild(td);
  var tm=document.createElement('div');tm.className='tm';
  tm.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  b.appendChild(tm);w.appendChild(b);cb.appendChild(w);cb.scrollTop=cb.scrollHeight;
}
function showT(){

  d.innerHTML='<div class="typw"><div class="tdt"></div><div class="tdt"></div><div class="tdt"></div></div>';
  cb.appendChild(d);cb.scrollTop=cb.scrollHeight;
}
function hideT(){var e=document.getElementById('typI');if(e)e.remove()}
