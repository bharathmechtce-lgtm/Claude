<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJUK Order Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#efeae2;height:100vh;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100vh;max-width:960px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.18);background:#efeae2}
.topbar{background:#202c33;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .tt{font-weight:700;font-size:16px;margin-right:auto;white-space:nowrap}
.topbar label{font-size:9px;color:#8696a0;text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:1px}
.topbar input,.topbar select{padding:5px 8px;border:1px solid #374151;border-radius:5px;font-size:11px;background:#111b21;color:#e9edef;outline:none}
.topbar input:focus,.topbar select:focus{border-color:#00a884}
.topbar input[type=password]{width:180px;font-family:monospace;font-size:10px}
.status{font-size:11px;color:#8696a0;padding:1px 14px;background:#202c33;border-bottom:1px solid #374151}
.status .id{color:#00a884;font-weight:600}
.chat-area{flex:1;overflow-y:auto;padding:14px 24px}
.mw{display:flex;margin-bottom:4px}
.mw.cu{justify-content:flex-start}
.mw.bo{justify-content:flex-end}
.mb{max-width:72%;padding:7px 11px;border-radius:7px;font-size:13.5px;line-height:1.42;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.mw.cu .mb{background:#fff;border-top-left-radius:0}
.mw.bo .mb{background:#d9fdd3;border-top-right-radius:0}
.mb .tm{font-size:9px;color:#667781;text-align:right;margin-top:3px}
.sysmsg{text-align:center;margin:10px 0}
.sysmsg span{background:rgba(0,0,0,.06);color:#54656f;padding:4px 12px;border-radius:7px;font-size:11px}
.typw{display:inline-flex;gap:4px;padding:10px 14px;background:#d9fdd3;border-radius:7px;border-top-right-radius:0;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.tdt{width:6px;height:6px;background:#8696a0;border-radius:50%;animation:tp 1.4s infinite ease-in-out}
.tdt:nth-child(2){animation-delay:.2s}.tdt:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.bottom{background:#f0f2f5;border-top:1px solid #d1d7db}
.fin-row{padding:5px 14px;display:flex;gap:6px}
.fbtn{flex:1;padding:9px;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s}
.fbtn.pri{background:#0070f3;color:#fff}.fbtn.pri:hover{background:#005bd4}
.fbtn.sec{background:#e5e7eb;color:#374151}.fbtn.sec:hover{background:#d1d5db}
.fbtn:disabled{opacity:.5;cursor:not-allowed}
.input-row{padding:6px 14px 10px;display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;padding:9px 12px;border:1px solid #d1d7db;border-radius:7px;font-size:13.5px;font-family:inherit;resize:none;outline:none;min-height:42px;max-height:120px;line-height:1.38}
.input-row textarea:focus{border-color:#00a884}
.sbtn{width:42px;height:42px;border-radius:50%;background:#00a884;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
.sbtn:hover{background:#008069}
.sbtn svg{fill:#fff;width:18px;height:18px}
.ov{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.ov.sh{display:flex}
.modd{background:#fff;border-radius:10px;width:700px;max-height:80vh;overflow-y:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modd h2{font-size:16px;margin-bottom:12px}
.modd pre{background:#1e293b;color:#e2e8f0;padding:14px;border-radius:7px;font-size:11px;overflow-x:auto;max-height:400px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c5c5c5;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
  <div class="tt">TJUK Order Bot</div>
  <div><label>API Key</label><input type="password" id="apiKey" placeholder="sk-ant-..."></div>
  <div><label>Model</label>
    <select id="mdl">
      <option value="claude-sonnet-4-5-20250929">Sonnet 4.5</option>
      <option value="claude-haiku-4-5-20251001">Haiku 4.5</option>
    </select>
  </div>
</div>
<div class="status" id="stBar">Phase: <span class="id">Identification</span> — Bot doesn't know who you are yet</div>
<div class="chat-area" id="cb">
  <div class="sysmsg"><span>Start by introducing yourself (e.g. "Hi, this is Rahul from Good Food Concept")</span></div>
</div>
<div class="bottom">
  <div class="fin-row">
    <button class="fbtn pri" id="finBtn" onclick="finalizeOrder()" disabled>Finalize Order (JSON)</button>
    <button class="fbtn sec" onclick="resetChat()">Reset</button>
  </div>
  <div class="input-row">
    <textarea id="inp" placeholder='Hi, this is Rahul from Good Food Concept...' rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();snd()}"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
    <button class="sbtn" onclick="snd()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
</div>
</div>

<div class="ov" id="ov" onclick="if(event.target===this)this.classList.remove('sh')">
  <div class="modd">
    <h2>Finalized Order</h2>
    <pre id="ej">Loading...</pre>
    <div style="margin-top:12px;text-align:right">
      <button class="fbtn pri" onclick="navigator.clipboard.writeText(document.getElementById('ej').textContent)" style="flex:none;padding:7px 18px">Copy</button>
      <button class="fbtn sec" onclick="document.getElementById('ov').classList.remove('sh')" style="flex:none;padding:7px 18px;margin-left:5px">Close</button>
    </div>
  </div>
</div>

var CDIR=[{"code":"CG00313","name":"GOOD FOOD CONCEPT","chat":"Good Food Concept"},{"code":"CC00815","name":"CREMURE","chat":"Cremure Order Group"},{"code":"CJ00241","name":"JALAPENO FOODS PVT LTD","chat":"Jalapeno Food Ordering"},{"code":"CL00037","name":"LAXMI FOODS","chat":"Laxmi Foods Pillsbury"},{"code":"CU00010","name":"URBAN GOURMET INDIA PRIVATE LIMITED (27 BAKE HOUSE)","chat":"Urban Gourmet UGIPL"},{"code":"CU00107","name":"URBAN GOURMET INDIA PRIVATE LIMITED","chat":"Urban Gourmet UGIPL"},{"code":"CU00126","name":"URBAN GOURMET INDIA PRIVATE LIMITED (27 BAKE HOUSE)","chat":"Urban Gourmet UGIPL"},{"code":"CI00164","name":"INNERCIRCLE HOSPITALITY LLP","chat":"DU Hospitality X TJUK"},{"code":"CO00008","name":"OBEROI TOWER (NARIMAN POINT)","chat":"Ketan Oberoi Tower"},{"code":"CB00367","name":"BELLONA HOSPITALITY SERVICES LIMITED","chat":"Bellona VS TJUK"},{"code":"CK00392","name":"KIRAN BAWA HOTELS PVT LTD.","chat":"BAWA GROUP ORDERING"},{"code":"CH00177","name":"KIRAN BAWA HOTELS PVT LTD.","chat":"BAWA GROUP ORDERING"},{"code":"CM01282","name":"MONARCH LIBERTY HOSPITALITY PRIVATE LIMITED","chat":"Monarch Liberty"},{"code":"CM01292","name":"MONARCH LIBERTY WORLDWIDE HOSPITALITY LLP (Powai)","chat":"Monarch Liberty"},{"code":"CS01645","name":"SNOW WORLD ENTERTAINMENT","chat":"Snow World & TJUK ORDERING"},{"code":"CP00706","name":"PRASUK JAIN HOSPITALITY","chat":"Snow World & TJUK ORDERING"},{"code":"CP00762","name":"PRASUK JAIN HOSPITALITY PRIVATE LIMITED","chat":"Snow World & TJUK ORDERING"},{"code":"CK00598","name":"KEPCHAKI MOMO","chat":"Kulturd Kombucha"}];
var PHASE1="You are a WhatsApp order-taking assistant for TJUK (a food distributor in Mumbai).\n\nA new message has arrived. You DO NOT know who this customer is yet.\n\nYOUR ONLY JOB RIGHT NOW: Identify the customer.\n- Greet them warmly and ask who they are (name, restaurant, or customer code)\n- Match against this customer directory:\n\n  CG00313 = GOOD FOOD CONCEPT (WhatsApp: Good Food Concept)\n  CC00815 = CREMURE (WhatsApp: Cremure Order Group)\n  CJ00241 = JALAPENO FOODS PVT LTD (WhatsApp: Jalapeno Food Ordering)\n  CL00037 = LAXMI FOODS (WhatsApp: Laxmi Foods Pillsbury)\n  CU00010 = URBAN GOURMET INDIA PRIVATE LIMITED (27 BAKE HOUSE) (WhatsApp: Urban Gourmet UGIPL)\n  CU00107 = URBAN GOURMET INDIA PRIVATE LIMITED (WhatsApp: Urban Gourmet UGIPL)\n  CU00126 = URBAN GOURMET INDIA PRIVATE LIMITED (27 BAKE HOUSE) (WhatsApp: Urban Gourmet UGIPL)\n  CI00164 = INNERCIRCLE HOSPITALITY LLP (WhatsApp: DU Hospitality X TJUK)\n  CO00008 = OBEROI TOWER (NARIMAN POINT) (WhatsApp: Ketan Oberoi Tower)\n  CB00367 = BELLONA HOSPITALITY SERVICES LIMITED (WhatsApp: Bellona VS TJUK)\n  CK00392 = KIRAN BAWA HOTELS PVT LTD. (WhatsApp: BAWA GROUP ORDERING)\n  CH00177 = KIRAN BAWA HOTELS PVT LTD. (WhatsApp: BAWA GROUP ORDERING)\n  CM01282 = MONARCH LIBERTY HOSPITALITY PRIVATE LIMITED (WhatsApp: Monarch Liberty)\n  CM01292 = MONARCH LIBERTY WORLDWIDE HOSPITALITY LLP (Powai) (WhatsApp: Monarch Liberty)\n  CS01645 = SNOW WORLD ENTERTAINMENT (WhatsApp: Snow World & TJUK ORDERING)\n  CP00706 = PRASUK JAIN HOSPITALITY (WhatsApp: Snow World & TJUK ORDERING)\n  CP00762 = PRASUK JAIN HOSPITALITY PRIVATE LIMITED (WhatsApp: Snow World & TJUK ORDERING)\n  CK00598 = KEPCHAKI MOMO (WhatsApp: Kulturd Kombucha)\n\nMATCHING RULES:\n- Fuzzy match: \"Good Food\" matches \"GOOD FOOD CONCEPT\", \"Oberoi\" matches \"OBEROI TOWER\"\n- \"Prasuk\" or \"Prasuk Jain\" matches \"PRASUK JAIN HOSPITALITY\"\n- Multiple card codes can belong to the same business (e.g. URBAN GOURMET has CU00010, CU00107, CU00126)\n\nWHEN YOU IDENTIFY THEM:\n- Include this EXACT tag on the VERY FIRST LINE of your response: ##CUSTID:CXXXXX##\n  (replace CXXXXX with the actual card code)\n- Then greet them: \"Hi [Name]! Great to hear from you.\"\n- If they have multiple addresses, ask which one. If one address, confirm it.\n\nIF YOU CANNOT MATCH:\n- Say \"I couldn't find your account. Could you share your registered business name or customer code?\"\n- Do NOT include the ##CUSTID tag.\n\nSTYLE: Short, warm, WhatsApp-style. 2-3 lines max.";
var PHASE2T="You are a WhatsApp order-taking assistant for TJUK (food distributor, Mumbai).\n\nCUSTOMER: {CUST_NAME} ({CUST_CODE})\nSHIP-TO ADDRESSES: {ADDRS}\n\nTHEIR ORDER HISTORY (items they regularly buy):\n{ITEMS}\n\nQUANTITY CONVERSION RULES (CRITICAL \u2014 apply these to EVERY item):\n  \"X case\"/\"X box\"/\"X ctn\"/\"X carton\" \u2192 X \u00d7 PackSize = Y PCS\n  \"X kg\" \u2192 X \u00f7 UnitWeight = Y PCS (round to nearest whole)\n  \"X pcs\"/\"X btl\"/\"X bottle\"/\"X pkt\"/\"X packet\"/\"X nos\" \u2192 X PCS (direct)\n  \"X\" (no unit, just a number) \u2192 Check their history for typical qty pattern. If unclear, ASK.\n  ALWAYS show conversion math when confirming: \"Amul Butter 500g \u2014 5kg \u00f7 0.5kg = 10 PCS \u2713\"\n\nYOUR JOB:\n1. Take their order conversationally. Acknowledge each item immediately.\n2. Match items to their ORDER HISTORY using fuzzy matching.\n   \"butter\" \u2192 if they usually order AMUL BUTTER 500GM, assume that.\n   \"coke\" \u2192 if they usually order COCA COLA 300ML CAN, assume that.\n3. Confirm each item with the converted PCS quantity and show math.\n4. Handle additions (\"also add...\"), changes (\"make it 5 not 3\"), removals (\"remove the butter\").\n5. When they say \"done\"/\"that's it\"/\"bas\" \u2192 summarize the full order with all conversions, then ask to confirm.\n6. On confirmation \u2192 \"Order confirmed! \u2713\"\n\nIF ITEM NOT IN HISTORY:\n- Ask them to clarify the exact product name or size\n- You can suggest similar items from their history\n\nSTYLE: Short (2-4 lines). Warm but efficient. WhatsApp-style. NO JSON unless asked by system.";

var hist = [];
var identifiedCust = null;
var busy = false;

function getSystemPrompt() {
  if (!identifiedCust) return PHASE1;
  var c = CDATA[identifiedCust];
  var itemLines = c.items.map(function(it) {
    return '  ' + it.code + ' | ' + it.name + ' | PackSize:' + it.ps + ' | UnitWt:' + it.uw + 'kg | ' + it.grp + ' | ordered ' + it.cnt + 'x (qty ' + it.minq + '-' + it.maxq + ')';
  }).join('\n');
  return PHASE2T
    .replace('{CUST_NAME}', c.name)
    .replace('{CUST_CODE}', c.code)
    .replace('{ADDRS}', c.addrs.join(', '))
    .replace('{ITEMS}', itemLines);
}

function updateStatus() {
  var bar = document.getElementById('stBar');
  var btn = document.getElementById('finBtn');
  if (identifiedCust) {
    var c = CDATA[identifiedCust];
    bar.innerHTML = 'Customer: <span class="id">' + c.name + '</span> (' + identifiedCust + ') — ' + c.items.length + ' products loaded';
    btn.disabled = false;
  } else {
    bar.innerHTML = 'Phase: <span class="id">Identification</span> — Bot doesn\'t know who you are yet';
    btn.disabled = true;
  }
}

async function snd(override) {
  var inp = document.getElementById('inp');
  var txt = override || inp.value.trim();
  if (!txt || busy) return;
  var key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('Paste your Anthropic API key in the top bar.'); return; }
  addMsg('cu', txt);
  if (!override) { inp.value = ''; inp.style.height = '42px'; }
  hist.push({role: 'user', content: txt});
  busy = true;
  showTyping();
  try {
    var sysp = getSystemPrompt();
    var resp = await callAPI(key, hist, sysp);
    hideTyping();
    // Check for customer identification tag
    if (!identifiedCust) {
      var m = resp.match(/##CUSTID:(\w+)##/);
      if (m && CDATA[m[1]]) {
        identifiedCust = m[1];
        updateStatus();
      }
    }
    // Strip the tag from display
    var display = resp.replace(/##CUSTID:\w+##\n?/g, '').trim();
    hist.push({role: 'assistant', content: resp});
    addMsg('bo', display);
  } catch(e) {
    hideTyping();
    addMsg('bo', '[Error: ' + e.message + ']');
  }
  busy = false;
  inp.focus();
}

async function callAPI(key, msgs, sys) {
  var mdl = document.getElementById('mdl').value;
  var r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({model: mdl, max_tokens: 2048, system: sys, messages: msgs})
  });
  var d = await r.json();
  if (r.status !== 200) throw new Error(d.error ? d.error.message : JSON.stringify(d));
  return d.content.filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
}

async function finalizeOrder() {
  if (!identifiedCust || hist.length < 2) { alert('Chat with the bot first.'); return; }
  var key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('Enter API key.'); return; }
  var extractPrompt = 'SYSTEM INSTRUCTION: Output the final order as JSON. Apply ALL conversions.\n\n';
  extractPrompt += 'Format:\n{\n  "customer_code": "...",\n  "customer_name": "...",\n  "ship_to": "...",\n';
  extractPrompt += '  "lines": [\n    {\n      "item_code": "from catalog",\n      "item_name": "from catalog",\n';
  extractPrompt += '      "quantity_pcs": 72,\n      "customer_said": "3 case coke",\n';
  extractPrompt += '      "conversion": "3 case x 24 (PackSize) = 72 PCS"\n    }\n  ]\n}\n\n';
  extractPrompt += 'RULES:\n- ALL quantities in PCS after conversion\n- Show conversion math for EVERY line\n';
  extractPrompt += '- Use PackSize for case/box/ctn, UnitWeight for kg\n- Include only FINAL items (after all additions/removals)\n- Output ONLY the JSON, nothing else';

  document.getElementById('ej').textContent = 'Extracting order with conversions...';
  document.getElementById('ov').classList.add('sh');
  var msgs = hist.concat([{role: 'user', content: extractPrompt}]);
  try {
    var resp = await callAPI(key, msgs, getSystemPrompt());
    var jm = resp.match(/\{[\s\S]*\}/);
    if (jm) {
      try { var p = JSON.parse(jm[0]); document.getElementById('ej').textContent = JSON.stringify(p, null, 2); }
      catch(e) { document.getElementById('ej').textContent = resp; }
    } else {
      document.getElementById('ej').textContent = resp;
    }
  } catch(e) {
    document.getElementById('ej').textContent = 'Error: ' + e.message;
  }
}

function resetChat() {
  if (!confirm('Reset chat?')) return;
  hist = [];
  identifiedCust = null;
  updateStatus();
  document.getElementById('cb').innerHTML = '<div class="sysmsg"><span>Start by introducing yourself (e.g. "Hi, this is Rahul from Good Food Concept")</span></div>';
}

function addMsg(role, txt) {
  var cb = document.getElementById('cb');
  var w = document.createElement('div');
  w.className = 'mw ' + (role === 'cu' ? 'cu' : 'bo');
  var b = document.createElement('div');
  b.className = 'mb';
  var td = document.createElement('div');
  td.textContent = txt;
  b.appendChild(td);
  var tm = document.createElement('div');
  tm.className = 'tm';
  tm.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  b.appendChild(tm);
  w.appendChild(b);
  cb.appendChild(w);
  cb.scrollTop = cb.scrollHeight;
}

function showTyping() {
  var cb = document.getElementById('cb');
  var d = document.createElement('div');
  d.id = 'typI';
  d.className = 'mw bo';
  d.innerHTML = '<div class="typw"><div class="tdt"></div><div class="tdt"></div><div class="tdt"></div></div>';
  cb.appendChild(d);
  cb.scrollTop = cb.scrollHeight;
}

function hideTyping() {
  var e = document.getElementById('typI');
  if (e) e.remove();
}

</script>
