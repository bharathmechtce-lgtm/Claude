<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TJUK Order Bot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#efeae2;height:100vh;overflow:hidden}
.wrap{display:flex;height:100vh;max-width:1200px;margin:0 auto;box-shadow:0 0 30px rgba(0,0,0,.18)}
.left{flex:1;display:flex;flex-direction:column;background:#efeae2;min-width:0}
.right{width:340px;background:#fff;border-left:1px solid #d1d7db;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#202c33;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
.topbar .tt{font-weight:700;font-size:15px;flex:1;white-space:nowrap}
.topbar .mdl{font-size:10px;color:#00a884;background:#0d1418;padding:3px 8px;border-radius:4px}
.status{font-size:11px;color:#8696a0;padding:4px 16px;background:#1a2329;border-bottom:1px solid #2a3942}
.status .id{color:#00a884;font-weight:600}
.chat-area{flex:1;overflow-y:auto;padding:14px 20px}
.mw{display:flex;margin-bottom:4px}
.mw.cu{justify-content:flex-start}
.mw.bo{justify-content:flex-end}
.mb{max-width:78%;padding:6px 10px;border-radius:7px;font-size:13px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.mw.cu .mb{background:#fff;border-top-left-radius:0}
.mw.bo .mb{background:#d9fdd3;border-top-right-radius:0}
.mb .tm{font-size:9px;color:#667781;text-align:right;margin-top:2px}
.sysmsg{text-align:center;margin:10px 0}
.sysmsg span{background:rgba(0,0,0,.06);color:#54656f;padding:4px 12px;border-radius:7px;font-size:11px}
.tool-msg{text-align:center;margin:3px 0}
.tool-msg span{background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:6px;font-size:10px;font-family:monospace}
.typw{display:inline-flex;gap:4px;padding:10px 14px;background:#d9fdd3;border-radius:7px;border-top-right-radius:0;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.tdt{width:6px;height:6px;background:#8696a0;border-radius:50%;animation:tp 1.4s infinite ease-in-out}
.tdt:nth-child(2){animation-delay:.2s}.tdt:nth-child(3){animation-delay:.4s}
@keyframes tp{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
.bottom{background:#f0f2f5;border-top:1px solid #d1d7db;flex-shrink:0;position:relative;z-index:10}
.input-row{padding:8px 14px 10px;display:flex;gap:8px;align-items:flex-end}
.input-row textarea{flex:1;padding:9px 12px;border:1px solid #d1d7db;border-radius:7px;font-size:13px;font-family:inherit;resize:none;outline:none;min-height:44px;max-height:110px;line-height:1.35}
.input-row textarea:focus{border-color:#00a884}
.sbtn{width:44px;height:44px;border-radius:50%;background:#00a884;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sbtn:hover{background:#008069}
.sbtn svg{fill:#fff;width:18px;height:18px}
.rh{background:#202c33;color:#fff;padding:10px 14px;font-weight:700;font-size:14px}
.rp{flex:1;overflow-y:auto;padding:12px;font-size:11px}
.rc{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-bottom:8px}
.rc h4{font-size:11px;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.rc pre{font-size:10px;white-space:pre-wrap;word-break:break-all;color:#334155;max-height:200px;overflow-y:auto}
.rb{padding:8px 12px;border-top:1px solid #e2e8f0}
.fbtn{width:100%;padding:9px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-bottom:4px}
.fbtn.pri{background:#0070f3;color:#fff}.fbtn.pri:hover{background:#005bd4}
.fbtn.sec{background:#e5e7eb;color:#374151}.fbtn.sec:hover{background:#d1d5db}
.fbtn:disabled{opacity:.4;cursor:not-allowed}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#c5c5c5;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">
<div class="left">
  <div class="topbar">
    <div class="tt">TJUK Order Bot</div>
    <div class="mdl">claude-sonnet-4-5</div>
  </div>
  <div class="status" id="stBar">Waiting for customer message...</div>
  <div class="chat-area" id="cb">
    <div class="sysmsg"><span>Send a message as the customer to start</span></div>
  </div>
  <div class="bottom">
    <div class="input-row">
      <textarea id="inp" placeholder='e.g. "Hi this is Rahul from Good Food, need to place an order"' rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();snd()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px'"></textarea>
      <button class="sbtn" onclick="snd()"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
  </div>
</div>
<div class="right">
  <div class="rh">Order State</div>
  <div class="rp" id="rp">
    <div class="rc"><h4>Customer</h4><pre id="rcust">Not identified yet</pre></div>
    <div class="rc"><h4>Tool Calls</h4><pre id="rtools">None yet</pre></div>
    <div class="rc"><h4>Extracted Order (JSON)</h4><pre id="rorder">No order yet</pre></div>
  </div>
  <div class="rb">
    <button class="fbtn pri" id="finBtn" onclick="finalizeOrder()" disabled>Finalize Order (JSON)</button>
    <button class="fbtn sec" onclick="resetChat()">Reset Chat</button>
  </div>
</div>
</div>

var SYSP="You are a WhatsApp order-taking assistant for TJUK, a food distribution company in Mumbai, India.\n\nYou have access to tools to look up customers and search products. USE THEM.\n\nFLOW:\n1. Customer sends a message. Extract their name/business and call lookup_customer to find them.\n2. Once identified, check ship_to_addresses from lookup result.\n   - If ONLY 1 address -> use it automatically, mention it: \"Delivering to [address], right?\"\n   - If MULTIPLE addresses -> ask which one BEFORE taking items: \"Which location today?\" and list them numbered.\n   - MUST confirm ship-to before proceeding to items.\n3. For each item they mention, call search_product. Results are RANKED: customer's historical orders appear FIRST (marked from_history:true with times_ordered and typical_qty). Prefer these — they're what this customer actually buys. Catalog results follow.\n4. Confirm each item with CONVERTED quantity in PCS:\n   - \"X case/box/ctn\" -> X * PackSize = Y PCS. Show: \"Item \u2014 X case x PackSize = Y PCS\"\n   - \"X kg\" -> X / UnitWeight = Y PCS (round). Show: \"Item \u2014 Xkg / UnitWt = Y PCS\"\n   - \"X pcs/btl/pkt/nos\" -> X PCS direct\n   - No unit -> call get_order_history, check their typical qty, or ASK.\n5. Handle additions, changes, removals.\n6. When done (\"that's it\"/\"done\"/\"bas\") -> summarize full order with all conversions -> ask to confirm.\n7. On yes -> \"Order confirmed!\"\n\nSTYLE: Short (2-3 lines). Warm. WhatsApp-style. Never output JSON unless system asks.\nIMPORTANT: ALWAYS use tools. Never guess customer identity or product details.";
var TOOLS=[{"name":"lookup_customer","description":"Look up a customer by name, business name, or customer code. Returns matching customer details including addresses and order history.","input_schema":{"type":"object","properties":{"query":{"type":"string","description":"Customer name, business name, or code to search for. E.g. 'Good Food', 'Rahul', 'Oberoi', 'CG00313'"}},"required":["query"]}},{"name":"search_product","description":"Search the product catalog by name or keyword. Returns matching products with item_code, name, PackSize, UnitWeight, and category.","input_schema":{"type":"object","properties":{"query":{"type":"string","description":"Product name or keyword. E.g. 'amul butter', 'coke 300ml', 'cheese', 'mayo'"}},"required":["query"]}},{"name":"get_order_history","description":"Get a customer's order history \u2014 what they typically order, quantities, and frequency. Use after customer is identified.","input_schema":{"type":"object","properties":{"customer_code":{"type":"string","description":"The customer code, e.g. 'CG00313'"}},"required":["customer_code"]}}];

var hist = [];

var toolLog = [];

// ===== LOCAL TOOL HANDLERS =====
function handleTool(name, input) {
  if (name === 'lookup_customer') return toolLookupCustomer(input.query);
  if (name === 'search_product') return toolSearchProduct(input.query);
  if (name === 'get_order_history') return toolGetHistory(input.customer_code);
  return {error: 'Unknown tool: ' + name};
}

function toolLookupCustomer(query) {
  var q = query.toLowerCase();
  var matches = [];
  for (var code in CUSTS) {
    var c = CUSTS[code];
    var searchStr = (c.name + ' ' + c.chat + ' ' + c.code).toLowerCase();
    if (searchStr.indexOf(q) !== -1) {
      matches.push({
        code: c.code, name: c.name, chat_name: c.chat,
        ship_to_addresses: c.addrs,
        total_products_ordered: c.items.length
      });
    }
  }
  // Fuzzy: try each word
  if (matches.length === 0) {
    var words = q.split(/\s+/);
    for (var code in CUSTS) {
      var c = CUSTS[code];
      var searchStr = (c.name + ' ' + c.chat + ' ' + c.code).toLowerCase();
      for (var w = 0; w < words.length; w++) {
        if (words[w].length > 2 && searchStr.indexOf(words[w]) !== -1) {
          matches.push({
            code: c.code, name: c.name, chat_name: c.chat,
            ship_to_addresses: c.addrs,
            total_products_ordered: c.items.length
          });
          break;
        }
      }
    }
  }
  if (matches.length === 0) return {found: false, message: 'No customer found matching "' + query + '"'};
  // Set identified customer to first match
  if (!identifiedCust && matches.length > 0) {
    identifiedCust = matches[0].code;
    updateStatus();
  }
  return {found: true, count: matches.length, customers: matches.slice(0, 5)};
}

function toolSearchProduct(query) {
  var q = query.toLowerCase().replace(/[^a-z0-9\s]/g, '');
  var words = q.split(/\s+/).filter(function(w) { return w.length > 1; });
  var histCodes = {};
  var histItems = [];
  // Step 1: Search customer's order history FIRST
  if (identifiedCust && CUSTS[identifiedCust]) {
    var cItems = CUSTS[identifiedCust].items;
    for (var h = 0; h < cItems.length; h++) {
      var it = cItems[h];
      var hname = it.name.toLowerCase();
      var hscore = 0;
      if (hname.indexOf(q) !== -1) hscore += 100;
      for (var w = 0; w < words.length; w++) {
        if (hname.indexOf(words[w]) !== -1) hscore += 10;
      }
      if (hscore > 0) {
        hscore += 500; // history boost
        hscore += it.cnt; // order frequency boost
        histItems.push({score: hscore, r: {
          item_code: it.code, item_name: it.name,
          pack_size: it.ps, unit_weight_kg: it.uw,
          category: it.grp,
          from_history: true, times_ordered: it.cnt,
          typical_qty: it.minq + '-' + it.maxq + ' PCS'
        }});
        histCodes[it.code] = true;
      }
    }
    histItems.sort(function(a,b){return b.score-a.score});
  }
  // Step 2: Search full catalog (skip already-matched history items)
  var catItems = [];
  for (var i = 0; i < PRODS.length; i++) {
    var p = PRODS[i];
    if (histCodes[p.c]) continue;
    var name = p.n.toLowerCase();
    var score = 0;
    if (name.indexOf(q) !== -1) score += 100;
    for (var w = 0; w < words.length; w++) {
      if (name.indexOf(words[w]) !== -1) score += 10;
    }
    if (score > 0) {
      catItems.push({score: score, r: {
        item_code: p.c, item_name: p.n,
        pack_size: p.ps, unit_weight_kg: p.uw,
        category: p.g,
        from_history: false
      }});
    }
  }
  catItems.sort(function(a,b){return b.score-a.score});
  // Combine: history first, then catalog, max 8
  var combined = histItems.concat(catItems).slice(0, 8);
  var results = combined.map(function(s){return s.r});
  if (results.length === 0) return {found: false, message: 'No product found matching "' + query + '"'};
  var hCount = histItems.length > 8 ? 8 : histItems.length;
  return {found: true, count: results.length, from_history: hCount, from_catalog: results.length - hCount, products: results};
}

function toolGetHistory(custCode) {
  var c = CUSTS[custCode];
  if (!c) return {error: 'Customer ' + custCode + ' not found'};
  var items = c.items.map(function(it) {
    return {
      item_code: it.code, item_name: it.name,
      pack_size: it.ps, unit_weight_kg: it.uw,
      category: it.grp, times_ordered: it.cnt,
      typical_qty_range: it.minq + '-' + it.maxq
    };
  });
  return {customer: c.name, code: custCode, item_count: items.length, items: items};
}

    currentMsgs.push({role: 'user', content: toolResults});
  }
  return {text: '[Max tool loops reached]', messages: currentMsgs};
}

// ===== SEND MESSAGE =====
async function snd() {
  var inp = document.getElementById('inp');
  var txt = inp.value.trim();
  if (!txt || busy) return;
  addMsg('cu', txt);
  inp.value = ''; inp.style.height = '40px';
  hist.push({role: 'user', content: txt});
  busy = true;
  showTyping();
  try {
    var result = await callWithTools(hist);
    hideTyping();
    addMsg('bo', result.text);
    // Update hist to include tool calls
    hist = result.messages;
    hist.push({role: 'assistant', content: result.text});
  } catch(e) {
    hideTyping();
    addMsg('bo', '[Error: ' + e.message + ']');
  }
  busy = false;
  inp.focus();
}

// ===== FINALIZE =====
async function finalizeOrder() {
  if (!identifiedCust || hist.length < 2) { alert('Chat first.'); return; }
  var ep = 'SYSTEM: Output the FINAL order as JSON. Apply ALL quantity conversions.\n\n';
  ep += 'Format:\n{\n  "customer_code": "...",\n  "customer_name": "...",\n  "ship_to": "...",\n';
  ep += '  "lines": [\n    {\n      "item_code": "...",\n      "item_name": "...",\n';
  ep += '      "quantity_pcs": 72,\n      "customer_said": "3 case coke",\n';
  ep += '      "conversion": "3 x 24 (PackSize) = 72 PCS"\n    }\n  ]\n}\n';
  ep += 'Output ONLY valid JSON.';
  document.getElementById('rorder').textContent = 'Extracting...';
  var msgs = hist.concat([{role: 'user', content: ep}]);
  try {
    var body = {model: MODEL, max_tokens: 2048, system: SYSP, messages: msgs};
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'x-api-key': APIKEY,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(body)
    });
    var d = await r.json();
    if (r.status !== 200) throw new Error(d.error ? d.error.message : JSON.stringify(d));
    var text = d.content.filter(function(b){return b.type==='text'}).map(function(b){return b.text}).join('');
    var jm = text.match(/\{[\s\S]*\}/);
    if (jm) {
      try { document.getElementById('rorder').textContent = JSON.stringify(JSON.parse(jm[0]), null, 2); }
      catch(e) { document.getElementById('rorder').textContent = text; }
    } else { document.getElementById('rorder').textContent = text; }
  } catch(e) { document.getElementById('rorder').textContent = 'Error: ' + e.message; }
}

// ===== UI HELPERS =====
function updateStatus() {
  var bar = document.getElementById('stBar');
  var btn = document.getElementById('finBtn');
  if (identifiedCust) {
    var c = CUSTS[identifiedCust];
    bar.innerHTML = 'Customer: <span class="id">' + c.name + '</span> (' + identifiedCust + ')';
    btn.disabled = false;
    document.getElementById('rcust').textContent = c.name + ' (' + identifiedCust + ')\nAddresses: ' + c.addrs.join(', ') + '\nHistory: ' + c.items.length + ' items';
  }
}

function updateToolLog() {
  var el = document.getElementById('rtools');
  var lines = toolLog.map(function(t) {
    var inp = JSON.stringify(t.input);
    var res = t.result.found !== undefined ? (t.result.found ? t.result.count + ' found' : 'not found') : 'returned';
    return t.tool + '(' + inp + ') -> ' + res;
  });
  el.textContent = lines.join('\n\n');
}

function showToolCall(name, input) {
  var cb = document.getElementById('cb');
  var d = document.createElement('div');
  d.className = 'tool-msg';
  d.innerHTML = '<span>' + name + '("' + (input.query || input.customer_code || '') + '")</span>';
  cb.appendChild(d);
  cb.scrollTop = cb.scrollHeight;
}

function addMsg(role, txt) {
  var cb = document.getElementById('cb');
  var w = document.createElement('div');
  w.className = 'mw ' + (role === 'cu' ? 'cu' : 'bo');
  var b = document.createElement('div');
  b.className = 'mb';
  var td = document.createElement('div');
  td.textContent = txt;
  b.appendChild(td);
  var tm = document.createElement('div');
  tm.className = 'tm';
  tm.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  b.appendChild(tm);
  w.appendChild(b);
  cb.appendChild(w);
  cb.scrollTop = cb.scrollHeight;
}

function showTyping() {
  var cb = document.getElementById('cb');
  var d = document.createElement('div');
  d.id = 'typI';
  d.className = 'mw bo';
  d.innerHTML = '<div class="typw"><div class="tdt"></div><div class="tdt"></div><div class="tdt"></div></div>';
  cb.appendChild(d);
  cb.scrollTop = cb.scrollHeight;
}

function hideTyping() { var e = document.getElementById('typI'); if (e) e.remove(); }

function resetChat() {
  if (!confirm('Reset?')) return;
  hist = []; identifiedCust = null; toolLog = [];
  document.getElementById('stBar').innerHTML = 'Waiting for customer message...';
  document.getElementById('cb').innerHTML = '<div class="sysmsg"><span>Send a message as the customer to start</span></div>';
  document.getElementById('rcust').textContent = 'Not identified yet';
  document.getElementById('rtools').textContent = 'None yet';
  document.getElementById('rorder').textContent = 'No order yet';
  document.getElementById('finBtn').disabled = true;
}

</script>
